# Dependabot: grouped security and version updates (CVE Remediation, ASP-6055).
# Security fixes for an ecosystem arrive as one PR. Minor and patch version updates arrive as one
# weekly PR. Major version updates still get their own PR, so each breaking change is reviewed alone.
version: 2
updates:
  - package-ecosystem: "npm"
    directories: ["/"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
